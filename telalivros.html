                        Nota

<div style="margin-top: 10px;">

                <!-- DESCRIÇÃO -->
                <h3>
                    <span id="titulo"></span>

        <div class="row mt-4">
            <div class="col-12 col-md-9 float-start mx-auto">
                <div id="avaliacoesContainer" class="row"></div>
            </div>
        </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tituloParam = params.get("titulo");

        fetch("json/livros.json")
            .then(res => res.json())
            .then(dados => {

                const livro = dados[tituloParam];

                if (!livro) {
                    console.log("Livro não encontrado");
                    return;
                }

                // Dados básicos

                document.getElementById("tituloLateral").textContent = livro.titulo;
                document.getElementById("autorLateral").textContent = livro.autor;
                document.getElementById("titulo").textContent = livro.titulo || tituloParam;
                document.getElementById("autor").textContent = livro.autor;
                document.getElementById("nota").textContent = livro.nota + " ★";
                document.getElementById("leram").textContent = livro.leram;
                document.getElementById("queremLer").textContent = livro.queremLer;
                document.getElementById("qtdResenhas").textContent = livro.qtdResenhas;
                document.getElementById("descricao").textContent = livro.descricao || "Sem descrição disponível.";

                // Capa
                document.getElementById("capa").src = livro.capa;

                const container = document.getElementById("avaliacoesContainer");

                if (!livro) return;

                // nomes fake só pra exemplo
                const nomes = livro.nomes;

                const avaliacoes = [
                    livro.avaliacao1,
                    livro.avaliacao2,
                    livro.avaliacao3
                ];

                avaliacoes.forEach((texto, i) => {

                    container.innerHTML += `
                <div class="col-md-4 p-2">
                    <div class="card card-avaliar">
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-3">
                                
                                <img src="${livro.avaliaImg[i]}" 
                                     class="rounded-circle me-3" width="30" height="30">

                                <h5 class="mb-0 me-auto">${nomes[i]}</h5>

                            </div>

                            <p class="card-text">"${texto}"</p>
                        </div>
                    </div>
                </div>
            `;
                });



            })
            .catch(err => console.error("Erro:", err));
    </script>
