<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editora</title>
    <meta name="description" content="Free Web tutorials">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="Eloisa & Haléxya">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo1.css">
    <link rel="stylesheet" href="css/tela.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" class="fontegoogle"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
   <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/icone.png" alt="logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="index.html">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="prateleira.html">ESTANTE</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="autores.html">AUTORES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="graficos.html">MAIS LIDOS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="avaliacoes.html">AVALIAÇÕES</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="autores.html">Autores e Editoras</a></li>
                <li class="breadcrumb-item active">Editora</li>
            </ol>
        </nav>

        <div class="row mt-3">
            <div class="col-md-3 text-center">

                <img id="logo" class="perfil-img img-fluid mb-3">

                <h5 id="nomeLateral"></h5>

                <div class="card mt-3 p-3 text-start">
                    <strong>Informações</strong>

                    <p>
                        Livros publicados
                        <span id="livrosLateral" class="float-end"></span>
                    </p>

                    <p>
                        Fundação
                        <span id="fundacao" class="float-end"></span>
                    </p>
                </div>

            </div>

            <!-- CONTEÚDO -->
            <div class="col-md-9 mt-3">

                <h3>
                    <span id="nome"></span>
                    <small class="text-muted">| <span id="pais"></span></small>
                </h3>

                <!-- BOXES -->
                <div class="row mt-3 d-flex justify-content-center">

                    <div class="col-9 col-md-6 mb-3">
                        <div class="box-info">
                            <h4 id="nota"></h4>
                            <small>Avaliação</small>
                        </div>
                    </div>

                    <div class="col-9 col-md-6 mb-3">
                        <div class="box-info">
                            <h4 id="totalLivros"></h4>
                            <small>Livros</small>
                        </div>
                    </div>

                    <div class="col-9 col-md-6 mb-3">
                        <div class="box-info">
                            <h4 id="leitores"></h4>
                            <small>Leitores</small>
                        </div>
                    </div>

                    <div class="col-9 col-md-6 mb-3">
                        <div class="box-info">
                            <h4 id="seguidores"></h4>
                            <small>Seguidores</small>
                        </div>
                    </div>

                </div>

                <!-- DESCRIÇÃO -->
                <p id="descricao" class="mt-4"></p>

                <!-- ESPECIALIDADE -->
                <span id="categoria" class="badge gradient"></span>

            </div>

        </div>

        <div class="row mt-4">
            <div class="col-12 col-md-6 mx-auto">
                <div class="card mt-4 p-3">
                    <div class="d-flex justify-content-between">
                        <h5>Livros publicados</h5>
                    </div>

                    <div class="position-relative mt-3">
                        <button class="btn gradient position-absolute top-50 start-0 translate-middle-y"
                            onclick="scrollLivros(-1)">
                            <i class="bi bi-chevron-left"></i>
                        </button>

                        <div id="livrosContainer" class="d-flex gap-3 livros mx-5"></div>

                        <button class="btn gradient position-absolute  top-50 end-0 translate-middle-y"
                            onclick="scrollLivros(1)">
                            <i class="bi bi-chevron-right"></i>
                        </button>

                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 mx-auto">
                <div class="card mt-4 p-4">
                    <h5>Estatísticas</h5>

                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span style="min-width: 80px;">5 estrelas</span>
                        <div class="avaliacao-bar flex-grow-1">
                            <div id="star5" class="avaliacao-fill"></div>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span style="min-width: 80px;">4 estrelas</span>
                        <div class="avaliacao-bar flex-grow-1">
                            <div id="star4" class="avaliacao-fill"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span style="min-width: 80px;">3 estrelas</span>
                        <div class="avaliacao-bar flex-grow-1">
                            <div id="star3" class="avaliacao-fill"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span style="min-width: 80px;">2 estrelas</span>
                        <div class="avaliacao-bar flex-grow-1">
                            <div id="star2" class="avaliacao-fill"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span style="min-width: 80px;">1 estrelas</span>
                        <div class="avaliacao-bar flex-grow-1">
                            <div id="star1" class="avaliacao-fill"></div>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id") || "companhia";

        fetch("json/editoras.json")
            .then(res => res.json())
            .then(dados => {

                const editora = dados[id];
                if (!editora) return;

                document.getElementById("nome").textContent = editora.nome;
                document.getElementById("nomeLateral").textContent = editora.nome;
                document.getElementById("pais").textContent = editora.pais;
                document.getElementById("nota").textContent = editora.nota + " ★";
                document.getElementById("totalLivros").textContent = editora.livros;
                document.getElementById("seguidores").textContent = editora.seguidores;
                document.getElementById("leitores").textContent = editora.leitores;
                document.getElementById("descricao").textContent = editora.descricao;
                document.getElementById("categoria").textContent = editora.categoria;
                document.getElementById("fundacao").textContent = editora.fundacao;
                document.getElementById("livrosLateral").textContent = editora.livros;

                document.getElementById("logo").src = editora.logo;

                // livros
                const container = document.getElementById("livrosContainer");
                editora.livrosImgs.forEach(img => {
                    container.innerHTML += `<img src="${img}">`;
                });

                // estatísticas
                document.getElementById("star5").style.width = editora.estatisticas["5"] + "%";
                document.getElementById("star4").style.width = editora.estatisticas["4"] + "%";
                document.getElementById("star3").style.width = editora.estatisticas["3"] + "%";
                document.getElementById("star2").style.width = editora.estatisticas["2"] + "%";
                document.getElementById("star1").style.width = editora.estatisticas["1"] + "%";
            });

        function scrollLivros(direcao) {
            const container = document.getElementById("livrosContainer");

            container.scrollBy({
                left: direcao * 300,
                behavior: 'smooth'
            });
        }
    </script>

</body>

</html>
