    <script>
        fetch("json/livros.json")
            .then(res => res.json())
            .then(dados => {

                const container = document.getElementById("listaLivros");

                Object.keys(dados).forEach(titulo => {

                    const livro = dados[titulo];

                    container.innerHTML += `
                    <div class="col-md-3 p-2">
                        <div class="card card-estilo text-center" onclick="abrirLivro('${titulo}')">
                            
                            <img src="${livro.capa}" class="img-fluid mb-2" alt="${livro.titulo}">

                            <div class="card-body">
                                <h6 class="mb-1">${livro.titulo || titulo}</h6>
                                <small class="text-muted">${livro.autor}</small>

                                <div class="mt-2">
                                    ⭐ ${livro.nota}
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                });
            });

        function abrirLivro(titulo) {
            // encode para evitar erro com espaços
            window.location.href = "telalivros.html?titulo=" + encodeURIComponent(titulo);
        }
    </script>
