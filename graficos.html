    <script>


        var livros = [
            "Harry Potter e a Pedra Filosofal",
            "É Assim que Acaba",
            "Percy Jackson e o Ladrão de Raios",
            "As Crônicas de Nárnia",
            "Extraordinário",
            "Orgulho e Preconceito",
            "1984",
            "Coraline",
            "A Biblioteca da Meia-Noite"
        ];
        var options = {
            series: [{
                name: "Leitores",
                data: [12500, 15000, 10200, 9500, 10800, 9100, 9400, 8600, 13200]


            }],
            colors: ['#e76485'],
            chart: {
                height: 350,
                type: 'line',
                zoom: {
                    enabled: false
                }
            },
            dataLabels: {
                enabled: false
            },
            stroke: {
                curve: 'straight'

            },

            grid: {
                row: {
                    colors: ['#f3f3f3', 'transparent'], // takes an array which will be repeated on columns
                    opacity: 0.5
                },
            },
            xaxis: {
                categories: ['Infantojuvenil', 'Romance', 'Fantasia', 'Aventura', 'Drama', 'Clássico', 'Ficção Científica', 'Suspense', 'Ficção'],

            },
            tooltip: {
                y: {
                    formatter: function (value, { dataPointIndex }) {
                        return value + " leitores - " + livros[dataPointIndex];
                    }
                }
            }



        };



        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();

        // segundo gráfico


        var options = {
            series: [15, 10, 4, 7],
            chart: {
                width: 380,
                type: 'pie',
            },
            labels: ['Romance', 'Fantasia', 'Aventura', 'Drama'],
            colors: ['#d9b1d6', '#96def0', '#e7d008', '#ffb300', '#88ba88'],
            responsive: [{
                breakpoint: 480,
                options: {
                    chart: {
                        width: 500,
                    },
                    legend: {
                        position: 'bottom'
                    }
                }
            }]
        };

        var chart = new ApexCharts(document.querySelector("#chart2"), options);
        chart.render();


        //terceiro gráfico (gráfico de barras)

        const dados = [2, 3, 8, 5, 4, 12, 7, 3, 5, 6, 9, 10];
        const total = dados.reduce((a, b) => a + b, 0);

        var options = {
            series: [{
                name: 'Porcentagem de livros lidos',
                data: dados
            }],
            chart: {
                height: 560,
                type: 'bar',
            },
            plotOptions: {
                bar: {
                    borderRadius: 10,
                    dataLabels: {
                        position: 'top',
                    },
                }
            },
            dataLabels: {
                enabled: true,
                formatter: function (val) {
                    const porcentagem = (val / total) * 100;
                    return porcentagem.toFixed(1) + "%";
                },
                offsetY: -20,
                style: {
                    fontSize: '12px',
                    colors: ["#304758"]
                }
            },

            xaxis: {
                categories: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                position: 'top',
                axisBorder: {
                    show: false
                },
                axisTicks: {
                    show: false
                },
                crosshairs: {
                    fill: {
                        type: 'gradient',
                        gradient: {
                            colorFrom: '#D8E3F0',
                            colorTo: '#BED1E6',
                            stops: [0, 100],
                            opacityFrom: 0.4,
                            opacityTo: 0.5,
                        }
                    }
                },
                tooltip: {
                    enabled: true,
                }
            },
            yaxis: {
                axisBorder: {
                    show: false
                },
                axisTicks: {
                    show: false,
                },
                labels: {
                    show: false,
                    formatter: function (val) {
                        return val + "%";
                    }
                }

            },

            fill: {
                type: 'gradient',
                gradient: {
                    shade: 'light',
                    type: "vertical", // pode testar "vertical"
                    shadeIntensity: 0.5,
                    gradientToColors: ["#f7f5f5"], // cor final
                    inverseColors: false,
                    opacityFrom: 1,
                    opacityTo: 1,
                    stops: [7, 29, 67, 91, 100],
                    colorStops: [
                        {
                            offset: 7,
                            color: "rgba(115, 172, 230, 1)"
                        },
                        {
                            offset: 29,
                            color: "rgba(166, 206, 255, 1)"
                        },
                        {
                            offset: 67,
                            color: "rgba(204, 219, 247, 1)"
                        },
                        {
                            offset: 91,
                            color: "rgba(233, 230, 240, 1)"
                        },
                        {
                            offset: 100,
                            color: "rgba(247, 245, 245, 1)"
                        }
                    ]
                }
            }
        };
        var chart = new ApexCharts(document.querySelector("#chart3"), options);
        chart.render();



        var options = {
            series: [{
                data: [15, 30]
            }],
            chart: {
                type: 'bar',
                height: 150,
                toolbar: { show: false }
            },
            plotOptions: {
                bar: {
                    horizontal: true,
                    borderRadius: 15,
                    borderRadiusApplication: 'end', // 👈 só na ponta
                    barHeight: '50%'
                }
            },
            colors: ['#1e73be', '#e0e0e0'],
            dataLabels: {
                enabled: true,
                offsetX: 10
            },
            xaxis: {
                categories: ['Livros lidos', 'Meta de leitura'],
                labels: { show: false }
            },
            grid: {
                show: false,
                padding: {
                    top: -10,
                    bottom: -10
                }
            },
            plotOptions: {
                bar: {
                    horizontal: true,
                    borderRadius: 20,
                    borderRadiusApplication: 'end'
                }
            },
            fill: {
                type: 'gradient',
                gradient: {
                    shade: 'light',
                    type: 'horizontal', // 👈 gráfico horizontal
                    shadeIntensity: 0.4,
                    inverseColors: false,
                    opacityFrom: 1,
                    opacityTo: 1,
                    colorStops: [
                        {
                            offset: 7,
                            color: "rgba(58, 161, 240, 1)"
                        },
                        {
                            offset: 46,
                            color: "rgba(94, 185, 255, 1)"
                        },
                        {
                            offset: 79,
                            color: "rgba(189, 215, 255, 1)"
                        },
                        {
                            offset: 100,
                            color: "rgba(196, 224, 255, 1)"
                        }
                    ]
                }
            }
        };

        var chart = new ApexCharts(document.querySelector("#chart4"), options);
        chart.render();

    </script>
